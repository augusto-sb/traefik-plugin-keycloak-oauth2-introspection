http:
  routers:
    my-router:
      rule: "Host(`example.com`)"
      service: my-service
      entryPoints:
        - "web"
      middlewares:
        - "my-middleware"
  services:
    my-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8080"
  middlewares:
    my-middleware:
      plugin:
        localkc:
          Method: "signature" # introspection | signature
          KeycloakCertsEndpoint: "https://example.com/auth/realms/realm/protocol/openid-connect/certs"
          ExpectedIssuer: "https://example.com/auth/realms/realm"
